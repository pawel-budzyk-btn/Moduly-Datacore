<html>
  <head>
    <title>Edycja dostawcy</title>
    <link rel="stylesheet" href="./../../styles.css" />
    <link rel="stylesheet" href="edycja-dostawcy.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Edycja dostawcy</div>
      <div class="menu-container__content">
        <div class="menu-container__content-additional-info-container">
          <div
            class="menu-container__content-additional-info-container-form-row"
          >
            <div
              class="menu-container__content-additional-info-container-form-row-item"
            >
              <div
                class="menu-container__content-additional-info-container-form-row-item-container"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-label"
                >
                  Nazwa dostawcy
                </div>
                <div
                  class="menu-container__content-additional-info-container-form-row-item-input"
                >
                  <input type="text" placeholder="Wpisz nazwę dostawcy" />
                </div>
              </div>
            </div>
            <div
              class="menu-container__content-additional-info-container-form-row-item"
            >
              <div
                class="menu-container__content-additional-info-container-form-row-item-container"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-label"
                >
                  Specjalista
                </div>
                <div
                  class="menu-container__content-additional-info-container-form-row-item-input"
                >
                  <img src="./../../user.svg" alt="user" />
                  <div
                    class="menu-container__content-additional-info-container-form-row-item-input-text"
                  >
                    Paweł Budzyk
                  </div>
                  <img src="./../../down-icon.svg" alt="arrow-down" />
                </div>
              </div>
              <div
                class="menu-container__content-additional-info-container-form-row-item-picker"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-picker-color"
                  style="background-color: #ff0000"
                ></div>
                <img src="./../../pipette.svg" />
              </div>
            </div>
          </div>
        </div>
        <div
          class="menu-container__content-additional-info-container-confirmation-buttons"
        >
          <button class="menu-container__content-button cancel-button">
            USUŃ DOSTAWCĘ
          </button>
          <button class="menu-container__content-button confirm-button">
            ZATWIERDŹ ZMIANY
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
