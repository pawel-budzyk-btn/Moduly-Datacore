<html>
  <head>
    <title>Drzewko parametryzacji</title>
    <link rel="stylesheet" href="./../styles.css" />
    <link rel="stylesheet" href="parametry.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Drzewko parametryzacji</div>
      <div class="menu-container__content">
        <div class="menu-container__content-list-items">
          <div class="menu-container__content-list-item list-item-active">
            1
          </div>
          <div class="menu-container__content-list-item">2</div>
          <div class="menu-container__content-list-item">3</div>
          <div class="menu-container__content-list-item">4</div>
          <div class="menu-container__content-list-item">5</div>
        </div>

        <div class="menu-container__content-input-wrapper">
          <input
            type="text"
            class="menu-container__content-input"
            placeholder="Wyszukaj..."
          />
          <img src="./../search.svg" />
        </div>

        <div class="menu-container__content_hierarchy-list">
          <div
            class="menu-container__content_hierarchy-list-item"
            style="margin-left: 0px"
          >
            <div class="menu-container__content_hierarchy-list-item-circle">
              -
            </div>
            <span>Parametry artykułu</span>
          </div>
          <div
            class="menu-container__content_hierarchy-list-item"
            style="margin-left: 16px"
          >
            <div class="menu-container__content_hierarchy-list-item-circle">
              -
            </div>
            <span>Nomenklatura</span>
          </div>
          <div
            class="menu-container__content_hierarchy-list-item"
            style="margin-left: 32px"
          >
            <div class="menu-container__content_hierarchy-list-item-circle">
              -
            </div>
            <span>Segment</span>
          </div>
          <div
            class="menu-container__content_hierarchy-list-item"
            style="margin-left: 32px"
          >
            <div class="menu-container__content_hierarchy-list-item-circle">
              +
            </div>
            <span>Kategoria</span>
          </div>
          <div
            class="menu-container__content_hierarchy-list-item"
            style="margin-left: 16px"
          >
            <div class="menu-container__content_hierarchy-list-item-circle">
              +
            </div>
            <span>PCB</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
