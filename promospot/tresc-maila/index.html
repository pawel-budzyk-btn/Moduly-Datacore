<html>
  <head>
    <title>Treść maila</title>
    <link rel="stylesheet" href="./../../styles.css" />
    <link rel="stylesheet" href="tresc-maila.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Treść maila</div>
      <div class="menu-container__content">
        <div class="menu-container__content-textarea-wrapper">
          <textarea class="menu-container__content-textarea">
          Witamy serdecznie, zapraszamy do składania ofert artykułów na AKCJĘ:

          Oferta uzgodniona z T.Dworskim2
          
          Składanie ofert będzie możliwe tylko poprzez link ofertowy w datach:
          
          Od: 18-01-2024 - 00:00
          Do: 25-01-2024 - 23:59
          (po dacie końcowej ofertowania Państwa link przestanie działać)
          
          W związku z powyższym zapraszamy Państwa do uzupełniania ofert. Artykuły, które nie będą miały uzupełnionej nomenklatury, wpisanych EANów oraz wgranych zdjęć zostaną pominięcie.
          
          W uwagach dostawcy koniecznie proszę zawrzeć informację o prawie zwrotu dla sklepów. Jeżeli takiej informacji nie będzie, artykuł zostanie usunięty. Bardzo proszę o umieszczenie ceny bazowej, ceny promo oraz nr Auchan z poprzedniego sezonu dla artykułów powtarzalnych (warunek konieczny) zalistowanych w Auchan. </textarea
          >
        </div>
        <div class="menu-container__content-buttons-wrapper">
          <button class="menu-container__content-button green-button">
            LINK DO OFERTOWANIA
          </button>
          <button class="menu-container__content-button red-button">
            ZATWIERDŹ ZMIANY
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
