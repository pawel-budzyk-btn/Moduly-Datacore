<html>
  <head>
    <title>Edycja Workflow</title>
    <link rel="stylesheet" href="./../styles.css" />
    <link rel="stylesheet" href="edycja-workflow.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Edycja Workflow - TG PGC T 49</div>
      <div class="menu-container__content">
        <div class="menu-container__content-additional-info-container">
          <div
            class="menu-container__content-additional-info-container-form-row"
          >
            <div
              class="menu-container__content-additional-info-container-form-row-item"
            >
              <div
                class="menu-container__content-additional-info-container-form-row-item-container"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-label"
                >
                  Nazwa
                </div>
                <div
                  class="menu-container__content-additional-info-container-form-row-item-input"
                >
                  <input type="text" placeholder="Wpisz nazwę dostawcy" />
                </div>
              </div>
              <div
                class="menu-container__content-additional-info-container-form-row-item-picker"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-picker-color"
                  style="background-color: #ff0000"
                ></div>
                <img src="./../pipette.svg" />
              </div>
            </div>
            <div
              class="menu-container__content-additional-info-container-form-row-item"
            >
              <div
                class="menu-container__content-additional-info-container-form-row-item-container"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-label"
                >
                  Data początku
                </div>
                <div
                  class="menu-container__content-additional-info-container-form-row-item-input"
                >
                  <input type="date" placeholder="Wpisz datę początku" />
                </div>
              </div>
              <div
                class="menu-container__content-additional-info-container-form-row-item-container"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-label"
                >
                  Data końca
                </div>
                <div
                  class="menu-container__content-additional-info-container-form-row-item-input"
                >
                  <input type="date" placeholder="Wpisz datę końca" />
                </div>
              </div>
            </div>
            <div
              class="menu-container__content-additional-info-container-form-row-item"
            >
              <div
                class="menu-container__content-additional-info-container-form-row-item-container"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-label"
                >
                  Link
                </div>
                <div
                  class="menu-container__content-additional-info-container-form-row-item-input"
                >
                  <input type="text" placeholder="Wpisz nazwę dostawcy" />
                </div>
              </div>
            </div>
            <div
              class="menu-container__content-additional-info-container-form-row-item"
            >
              <div
                class="menu-container__content-additional-info-container-form-row-item-container"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-label"
                >
                  Informacje dodatkowe
                </div>
                <div
                  class="menu-container__content-additional-info-container-form-row-item-textarea"
                >
                  <textarea
                    placeholder="Wpisz informacje dodatkowe"
                    rows="5"
                  ></textarea>
                </div>
              </div>
            </div>
            <div
              class="menu-container__content-additional-info-container-form-row-item"
            >
              <div
                class="menu-container__content-additional-info-container-form-row-item-container"
              >
                <div
                  class="menu-container__content-additional-info-container-form-row-item-input"
                >
                  <input type="text" placeholder="Wyszukaj..." />
                </div>
              </div>
            </div>
          </div>

          <div
            class="menu-container__content-additional-info-container-container-list"
          >
            <div
              class="menu-container__content-additional-info-container-container-list-item"
            >
              <div
                class="menu-container__content-game-item__content__checkbox-container"
              >
                <input class="item_checkbox" type="checkbox" />
              </div>
              <img src="./../workspace-list-item.svg" />
              <div>TG PGC T 49</div>
            </div>
            <div
              class="menu-container__content-additional-info-container-container-list-item"
            >
              <div
                class="menu-container__content-game-item__content__checkbox-container"
              >
                <input class="item_checkbox" type="checkbox" />
              </div>
              <img src="./../workspace-list-item.svg" />
              <div>TG PGC T 49</div>
            </div>
            <div
              class="menu-container__content-additional-info-container-container-list-item"
            >
              <div
                class="menu-container__content-game-item__content__checkbox-container"
              >
                <input class="item_checkbox" type="checkbox" />
              </div>
              <img src="./../workspace-list-item.svg" />
              <div>TG PGC T 49</div>
            </div>
            <div
              class="menu-container__content-additional-info-container-container-list-item"
            >
              <div
                class="menu-container__content-game-item__content__checkbox-container"
              >
                <input class="item_checkbox" type="checkbox" />
              </div>
              <img src="./../workspace-list-item.svg" />
              <div>TG PGC T 49</div>
            </div>
          </div>

          <div
            class="menu-container__content-additional-info-container-save-button"
          >
            <button>Scal</button>
          </div>
        </div>
        <div
          class="menu-container__content-additional-info-container-confirmation-buttons"
        >
          <button class="menu-container__content-button cancel-button">
            USUŃ I ZAPOMNIEJ LISTĘ
          </button>
          <button class="menu-container__content-button confirm-button">
            ZATWIERDŹ ZMIANY
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
