<html>
  <head>
    <title>Nomenklatura</title>
    <link rel="stylesheet" href="./../styles.css" />
    <link rel="stylesheet" href="nomenklatura.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Wybór Nomenklatury Artykułu</div>
      <div class="menu-container__content">
        <div class="menu-container__content-searcher">
          <input type="text" placeholder="Wyszukaj" />
          <img src="./../search.svg" />
        </div>
        <div class="menu-container__content-list">
          <div
            style="margin-left: 0"
            class="menu-container__content-list__item"
          >
            <img src="./../down-icon.svg" />
            <input type="checkbox" checked class="item_checkbox" />
            <span>Nomenklatura 1</span>
          </div>

          <div
            style="margin-left: 24px"
            class="menu-container__content-list__item"
          >
            <img src="./../down-icon.svg" />
            <input type="checkbox" checked class="item_checkbox" />
            <span>Nomenklatura 1</span>
          </div>

          <div
            style="margin-left: 48px"
            class="menu-container__content-list__item"
          >
            <img src="./../down-icon.svg" />
            <input type="checkbox" checked class="item_checkbox" />
            <span>Nomenklatura 1</span>
          </div>
        </div>

        <div class="menu-container__content-selected">
          <span>Wybrana nomenklatura</span>
          <div class="menu-container__content-selected-background"></div>
        </div>
        <div class="menu-container__content-selected-items">
          <div
            style="margin-left: 0"
            class="menu-container__content-selected-items__item"
          >
            <img src="./../nomenklatura-level.svg" />
            <span>Wybrana nomenklatura poziom 1</span>
          </div>
          <div
            style="margin-left: 22px"
            class="menu-container__content-selected-items__item"
          >
            <img src="./../nomenklatura-level.svg" />
            <span>Wybrana nomenklatura poziom 2</span>
            <div class="vertical-line"></div>
            <div class="horizontal-line"></div>
          </div>
          <div
            style="margin-left: 44px"
            class="menu-container__content-selected-items__item"
          >
            <img src="./../nomenklatura-level.svg" />
            <span>Wybrana nomenklatura poziom 2</span>
            <div class="vertical-line"></div>
            <div class="horizontal-line"></div>
          </div>
          <div
            style="margin-left: 66px"
            class="menu-container__content-selected-items__item"
          >
            <img src="./../nomenklatura-level.svg" />
            <span>Wybrana nomenklatura poziom 2</span>
            <div class="vertical-line"></div>
            <div class="horizontal-line"></div>
          </div>
          <div
            style="margin-left: 88px"
            class="menu-container__content-selected-items__item"
          >
            <img src="./../nomenklatura-level.svg" />
            <span>Wybrana nomenklatura poziom 2</span>
            <div class="vertical-line"></div>
            <div class="horizontal-line"></div>
          </div>
        </div>
        <button class="menu-container__content-button">Zatwierdź wybór</button>
      </div>
    </div>
  </body>
</html>
