<html>
  <head>
    <title>Kody EAN</title>
    <link rel="stylesheet" href="./../styles.css" />
    <link rel="stylesheet" href="kody-ean.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Kody EAN</div>
      <div class="menu-container__content">
        <div class="menu-container__content-ean-item ean-item-error">
          <img
            src="./../drag_n_drop.svg"
            class="menu-container__content-ean-item__drag-n-drop-icon"
          />
          <div class="menu-container__content-ean-item__input-container">
            <div
              class="menu-container__content-ean-item__input-container__input-label"
            >
              <span>Ean Główny</span>
              <div
                class="menu-container__content-ean-item__input-container__input-wrapper"
              >
                <input type="text" value="59455656854664" />
                <button>
                  <img src="./../input-clear.svg" />
                </button>
              </div>
              <div
                class="menu-container__content-ean-item__input-container__input-error"
              >
                <img src="./../input-error-icon.svg" />
                <span
                  >Kod Ean istnieje już w systemie Auchan jako artykuł 464564 -
                  Poduszka do spania segment 241</span
                >
              </div>
            </div>
          </div>
        </div>
        <div class="menu-container__content-ean-item ean-item-success">
          <img
            src="./../drag_n_drop.svg"
            class="menu-container__content-ean-item__drag-n-drop-icon"
          />
          <div class="menu-container__content-ean-item__input-container">
            <div
              class="menu-container__content-ean-item__input-container__input-label"
            >
              <span>Ean Główny</span>
              <div
                class="menu-container__content-ean-item__input-container__input-wrapper"
              >
                <input type="text" value="59455656854664" />
                <button>
                  <img src="./../input-clear.svg" />
                </button>
              </div>
              <div
                class="menu-container__content-ean-item__input-container__input-error"
              >
                <img src="./../input-success-icon.svg" />
                <span>Kod poprawny</span>
              </div>
            </div>
          </div>
        </div>
        <div class="menu-container__content-add-new-ean-item">
          <img src="./../plus.svg" />
        </div>
      </div>
    </div>
  </body>
</html>
