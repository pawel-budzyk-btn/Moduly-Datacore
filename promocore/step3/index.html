<html>
  <head>
    <title>Dodawanie oferty - 2 - Wybór artykułów</title>
    <link rel="stylesheet" href="./../../styles.css" />
    <link rel="stylesheet" href="step2.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">
        Dodawanie oferty - 2 - Wybór artykułów
      </div>
      <div class="menu-container__content">
        <div class="menu-container__content-list-items">
          <div class="menu-container__content-list-item">1</div>
          <div class="menu-container__content-list-item list-item-active">
            2
          </div>
          <div class="menu-container__content-list-item">3</div>
          <div class="menu-container__content-list-item">4</div>
          <div class="menu-container__content-list-item">5</div>
        </div>
        <div class="button">IMPORTUJ Z PROMO COM</div>
        <div class="menu-container__content-form">
          <label>Wklej listę artykułów</label>
          <div class="menu-container__content-form-input-container">
            <textarea placeholder="Wklej listę artykułów" rows="5"></textarea>
          </div>
        </div>

        <div class="menu-container__searcher-container">
          <input type="checkbox" id="searcher-checkbox" />
          <div class="menu-container__content-form" style="margin-top: 0">
            <div class="menu-container__content-form-input-container">
              <input type="text" placeholder="Wyszukaj" />
              <img src="./../../search.svg" />
            </div>
          </div>
        </div>

        <div class="menu-container__articles-list">
          <div class="menu-container__articles-list-item">
            <div><input type="checkbox" id="article-checkbox" checked /></div>

            <img src="./../../product_img.png" />
            <div class="menu-container__articles-list-item-content">
              <div class="menu-container__articles-list-item-content-title">
                BIO CHLEB ORKISZ+ SŁONECZNIK 250 G MESTEMACHER
              </div>
              <div class="menu-container__articles-list-item-content-line">
                <div
                  class="menu-container__articles-list-item-content-line-item"
                >
                  <strong>008</strong> Benus Sp. z o.o.
                </div>
                <div class="button-small">WYBIERZ</div>
              </div>
              <div class="menu-container__articles-list-item-content-line">
                <div
                  class="menu-container__articles-list-item-content-line-item"
                >
                  <strong>EAN</strong> 1234567890123
                </div>
                <div
                  class="menu-container__articles-list-item-content-line-item"
                >
                  <strong>CUG</strong> 123456789
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="menu-container__summary">
          <span>Wybrano <strong>1</strong> produkt</span>
        </div>
      </div>
    </div>
  </body>
</html>
