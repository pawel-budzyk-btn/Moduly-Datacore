<html>
  <head>
    <title>Widoczność</title>
    <link rel="stylesheet" href="/../../../styles.css" />
    <link rel="stylesheet" href="step1.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Widoczność i kolejność kolumn</div>
      <div class="menu-container__content">
        <div class="menu-container__content-list-items">
          <div class="menu-container__content-list-item list-item-active">
            1
          </div>
          <div class="menu-container__content-list-item">2</div>
          <div class="menu-container__content-list-item">3</div>
          <div class="menu-container__content-list-item">4</div>
          <div class="menu-container__content-list-item">5</div>
        </div>
        <div class="menu-container__content-form">
          <label>Rodzaj oferty</label>
          <div class="menu-container__content-form-input-container">
            <input type="text" placeholder="Wybierz" />
            <img src="/../../../down-icon.svg" />
          </div>
        </div>

        <div class="menu-container__content-form">
          <label>Nazwa oferty</label>
          <div class="menu-container__content-form-input-container">
            <input type="text" placeholder="Wybierz" />
          </div>
        </div>

        <div class="menu-container__content-form">
          <label>Numer oferty</label>
          <div class="menu-container__content-form-input-container">
            <input type="text" placeholder="Wybierz" />
          </div>
        </div>

        <div class="menu-container__content-form">
          <label>Notatka</label>
          <div class="menu-container__content-form-input-container">
            <textarea placeholder="Wpisz notatkę" rows="4"></textarea>
          </div>
        </div>

        <div class="menu-container__footer">
          <div>
            <div class="switch-container">
              <div class="switch-container__switch">
                <div class="switch-container__switch-circle"></div>
              </div>
            </div>
            <span>Załóż ofertę w <strong>METI Central</strong></span>
          </div>
          <div style="flex-direction: column">
            <div class="menu-container__footer-item">Integracja w METI</div>
            <div class="menu-container__footer-item-value">123456789</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
