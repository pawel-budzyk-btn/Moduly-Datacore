<html>
  <head>
    <title>Edytor nazw system /etykiety /paragon</title>
    <link rel="stylesheet" href="./../styles.css" />
    <link rel="stylesheet" href="multimedia.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Multimedia</div>
      <div class="menu-container__content">
        <div class="menu-container__content__header-file-container">
          <div class="menu-container__content__header-file-container__file">
            <div
              class="menu-container__content__header-file-container__file__left-side"
              style="background-color: #cd3950"
            >
              <img src="./../document-icon.svg" alt="pliki kodyfikacyjne" />
              <div
                class="menu-container__content__header-file-container__file__left-side__extension"
              >
                PDF
              </div>
            </div>
            <div
              class="menu-container__content__header-file-container__file__right-side"
            >
            <div
                  class="menu-container__content__header-file-container__file__right-side__top__title"
                >
                  <span>AAAbbbCCCddd - 202502 fffffffff</span>
                </div>
              <div
                class="menu-container__content__header-file-container__file__right-side__top"
              >
                <div
                  class="menu-container__content__header-file-container__file__right-side__top__description"
                >
                  <span>10.40 kB</span>
                  
                </div>
                
              </div>
              <div
                class="menu-container__content__header-file-container__file__right-side__bottom"
              >
                Wgrany przez: <strong>Paweł Budzyk</strong>, w dniu 
                <strong> 16.12.2024</strong> godz. 14:03
              </div>
            </div>
          </div>
        </div>

        <div class="menu-container__content__footer__upload-file-container">
          <div class="menu-container__content__footer__upload-file-container__upload-file">
            <div class="menu-container__content__footer__upload-file-container__upload-file__icon"></div>
            <div class="menu-container__content__footer__upload-file-container__upload-file__text">
              <img src="./../drop-files-icon.svg" alt="pliki kodyfikacyjne" />
              <span>Przeciągnij pliki tutaj, aby je wgrać</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
