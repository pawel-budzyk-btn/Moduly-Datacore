<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BDO Mobile - Wybór Modułu</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="bdo/bdo-mobile.css" />
  </head>
  <body>
    <div class="bdo-mobile-container" style="min-height: 100vh; border: none; border-radius: 0; padding: 12px;">
      
      <div class="module-list">
        
        <!-- PIM -->
        <a href="#" class="module-card">
          <div class="module-icon-container icon-pim">
          </div>
          <div class="module-details">
            <div class="module-name">PIM</div>
            <div class="module-desc">Parametryzacja produktu</div>
          </div>
          <div class="module-count-badge">23</div>
        </a>

        <!-- TASK SCHEDULER -->
        <a href="#" class="module-card">
          <div class="module-icon-container icon-tasks">
          </div>
          <div class="module-details">
            <div class="module-name">TASK SCHEDULER</div>
            <div class="module-desc">Zgłaszanie i odpowiadanie na zadania</div>
          </div>
          <div class="module-count-badge">2</div>
        </a>

        <!-- CZERWONY FAX -->
        <a href="#" class="module-card">
          <div class="module-icon-container icon-fax">
          </div>
          <div class="module-details">
            <div class="module-name">CZERWONY FAX</div>
            <div class="module-desc">Artykuły do wycofania ze sprzedaży</div>
          </div>
          <div class="module-count-badge">0</div>
        </a>

        <!-- BDO -->
        <a href="#" class="module-card">
          <div class="module-icon-container icon-bdo">
          </div>
          <div class="module-details">
            <div class="module-name">BDO</div>
            <div class="module-desc">Formularze rejestracji odpadów</div>
          </div>
          <div class="module-count-badge">55</div>
        </a>

      </div>

    </div>
  </body>
</html>
