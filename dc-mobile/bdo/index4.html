  <body>
    <div class="bdo-mobile-container">
      <div class="step-container">
        <div class="step-circle">1</div>
        <div class="step-circle">2</div>
        <div class="step-circle active">3</div>

            <div>Nazwa</div>

        </div>
        
        <!-- Table rows with radio buttons and icons -->
        <div class="table-row">
            <div style="display: flex; align-items: center; gap: 16px;">

                    <div class="radio-indicator-dot" style="width: 10px; height: 10px;"></div>
                </div>
