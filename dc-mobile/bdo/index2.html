<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BDO Mobile - Wybór Formularza</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="bdo-mobile.css" />
  </head>
  <body>
    <div class="bdo-mobile-container">
      <div class="step-container">
        <div class="step-circle active">1</div>
        <div class="step-circle">2</div>
        <div class="step-circle">3</div>
        <div class="step-circle">4</div>
      </div>

      <div class="card-list">
        <div class="form-card">
          <div class="form-card-header">
            <div class="radio-indicator">
              <div class="radio-indicator-dot"></div>
            </div>
            <div class="form-card-title">Formularz B</div>
          </div>
          <div class="form-card-description">
            Formularz B jest ... BEE Formularz B jest ... BEEFormularz B jest ... BEE Formularz B jest ... BEE
          </div>
        </div>

        <div class="form-card">
          <div class="form-card-header">
            <div class="radio-indicator unselected">
              <div class="radio-indicator-dot"></div>
            </div>
            <div class="form-card-title">Formularz C</div>
          </div>
          <div class="form-card-description">
            Formularz C jest ... CEEE Formularz C jest ... CEEE Formularz C jest ... CEEE Formularz C jest ... CEEE
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
