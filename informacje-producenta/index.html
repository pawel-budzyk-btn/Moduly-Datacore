<html>
  <head>
    <title>Informacje producenta</title>
    <link rel="stylesheet" href="./../styles.css" />
    <link rel="stylesheet" href="informacje-producenta.css" />
  </head>
  <body>
    <div class="menu-container">
      <div class="menu-container__header">Informacje producenta</div>
      <div class="menu-container__content">
        <div class="menu-container__top-section">
          <div class="menu-container__content__textareacontainer">
            <div class="menu-container__content__textareacontainer-label">
              <span>Ostrzeżenia dotyczące bezpieczeństwa</span>
              <img src="./../info-icon.svg" alt="info" />
            </div>
            <textarea rows="6" placeholder="Wpisać ostrzeżenia lub informacje nt. bezpieczeństwa (takie jakie są wymagane na produkcie, na opakowaniu lub w dokumencie załączonym do produktu zgodnie z GPSR lub regulacjami szczególnymi w języku polskim) np. oznaczenie CE, restrykcje wiekowe itp. Jeśli nie dotyczy lub brak ostrzeżeń wpisać "brak"" class="menu-container__content__textareacontainer-textarea"></textarea>
            <span class="menu-container__content__textareacontainer-warning">UWAGA: brak wypełnionych wymagań</span>
            <div class="menu-container__content__textareacontainer-edit">
              <img src="./../edit.svg" />
            </div>
          </div>

          <div class="menu-container__content__textareacontainer">
            <div class="menu-container__content__textareacontainer-label">
              <span>Dane Producenta</span>
              <img src="./../info-icon.svg" alt="info" />
            </div>
            <textarea rows="6" placeholder="w tym: Nazwa Producenta; Adres pocztowy; Adres mailowy; Adres internetowy (opcjonalne); Telefon kontaktowy (ocjonalne); Znak towarowy lub marka (jeśli jest); Dane pojednycznego punktu kontaktowego producenta jego adres pocztowy lub elektroniczny (jeśli są inne niż adres pocztowy/adres e-mailowy)." class="menu-container__content__textareacontainer-textarea"></textarea>
            <span class="menu-container__content__textareacontainer-warning">UWAGA: brak wypełnionych wymagań</span>
            <div class="menu-container__content__textareacontainer-edit">
              <img src="./../edit.svg" />
            </div>
          </div>

          <div class="menu-container__content__textareacontainer">
            <div class="menu-container__content__textareacontainer-label">
              <span>Dane Importera</span>
              <img src="./../info-icon.svg" alt="info" />
            </div>
            <textarea rows="6" placeholder="w tym: Nazwa Importera; Adres pocztowy; Adres mailowy; Adres internetowy (opcjonalne); Telefon kontaktowy (ocjonalne); Znak towarowy lub marka (jeśli jest); Dane pojednycznego punktu kontaktowego Importera jego adres pocztowy lub elektroniczny (jeśli są inne niż adres pocztowy/adres e-mailowy)" class="menu-container__content__textareacontainer-textarea"></textarea>
            <span class="menu-container__content__textareacontainer-warning">UWAGA: brak wypełnionych wymagań</span>
            <div class="menu-container__content__textareacontainer-edit">
              <img src="./../edit.svg" />
            </div>
          </div>

          <div class="menu-container__content__textareacontainer">
            <div class="menu-container__content__textareacontainer-label">
              <span>Adres zwrotny podmiotu</span>
              <img src="./../info-icon.svg" alt="info" />
            </div>
            <textarea rows="6" placeholder="w tym: Nazwa podmiotu odpowiedzialnego; Adres pocztowy; Adres mailowy; Adres internetowy (opcjonalne); Telefon kontaktowy (ocjonalne); Znak towarowy lub marka (jeśli jest)" class="menu-container__content__textareacontainer-textarea"></textarea>
            <span class="menu-container__content__textareacontainer-warning">UWAGA: brak wypełnionych wymagań</span>
            <div class="menu-container__content__textareacontainer-edit">
              <img src="./../edit.svg" />
            </div>
          </div>
        </div>
        <button class="menu-container__content-button">Zapisz</button>
      </div>
    </div>
  </body>
</html>
